name: Chrome Extension Publish

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  has-changed:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_change.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Check if version has been updated
        id: version_change
        uses: EndBug/version-check@v3

      - name: Early exit if version didn't change
        if: steps.version_change.outputs.changed != 'true'
        run: exit 1

  create-github-release-draft:
    runs-on: ubuntu-latest
    needs: has-changed
    steps:
      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.has-changed.outputs.version }}
          name: ${{ needs.has-changed.outputs.version }}
          draft: true
          prerelease: false

  chrome-publish:
    runs-on: ubuntu-latest
    needs: ['has-changed', 'create-github-release-draft']
    environment: chrome-publish
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install deps
        run: npm install

      - name: Build
        run: npm run release

      - name: Chrome Extension upload & publish
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path:
            releases/usos-srednia-${{ needs.has-changed.outputs.version }}.zip
          extension-id: lbbbenibppgfmakcjpdchgdkjfeipndb
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

      - name: Prepare GitHub release asset
        run:
          cp "releases/usos-srednia-${{ needs.has-changed.outputs.version
          }}.zip" "releases/usos-srednia-chrome-${{
          needs.has-changed.outputs.version }}.zip"

      - name: Upload Chrome release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.has-changed.outputs.version }}
          draft: true
          files:
            releases/usos-srednia-chrome-${{ needs.has-changed.outputs.version
            }}.zip

  firefox-publish:
    runs-on: ubuntu-latest
    needs: ['has-changed', 'create-github-release-draft']
    environment: firefox-publish
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install deps
        run: npm install

      - name: Build
        run: npm run release

      - name: Sign and publish Firefox extension
        uses: kewisch/action-web-ext@v2
        with:
          cmd: sign
          source:
            releases/usos-srednia-${{ needs.has-changed.outputs.version }}.zip
          channel: listed
          approvalTimeout: 0
          apiKey: ${{ secrets.AMO_API_KEY }}
          apiSecret: ${{ secrets.AMO_API_SECRET }}

      - name: Prepare GitHub release asset
        run:
          cp "releases/usos-srednia-${{ needs.has-changed.outputs.version
          }}.zip" "releases/usos-srednia-firefox-${{
          needs.has-changed.outputs.version }}.zip"

      - name: Upload Firefox release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.has-changed.outputs.version }}
          draft: true
          files:
            releases/usos-srednia-firefox-${{ needs.has-changed.outputs.version
            }}.zip

  github-release-publish:
    runs-on: ubuntu-latest
    needs:
      [
        'has-changed',
        'create-github-release-draft',
        'firefox-publish',
        'chrome-publish',
      ]
    steps:
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.has-changed.outputs.version }}
          draft: false
          prerelease: false
